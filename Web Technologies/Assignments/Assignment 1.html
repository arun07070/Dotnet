<!DOCTYPE html>
<html>
<head>
    <title>HTML Assignment</title>
</head>

<body>

    <!-- 1. Largest Heading -->
    <h1>Welcome</h1>

    <!-- 2. Second Highest Heading -->
    <h2>About Us</h2>

    <!-- 3. Third Highest Heading Center Align -->
    <h3 align="center">Welcome To HTML</h3>

    <!-- 4. Colored Heading -->
    <h2 style="color:#0066cc;">Services</h2>

    <!-- 5. Underlined and Colored Heading -->
    <h2 style="color:#ff0000;">
        <u>Important</u>
    </h2>

    <!-- 6. Text Input -->
    <label>Full Name:</label>
    <input type="text">

    <br><br>

    <!-- 7. Password Input -->
    <label>User Password:</label>
    <input type="password" placeholder="Enter your password">

    <br><br>

    <!-- 8. Checkbox -->
    <input type="checkbox" id="acceptBox">
    <label for="acceptBox">I Agree</label>

    <br><br>

    <!-- 9. Audio File -->
    <audio controls>
        <source src="C:\Users\arunpra\Downloads\Html audio file.mp3" type="audio/mpeg">
    </audio>

    <br><br>

    <!-- 10. Unordered List -->
    <ul>
        <li>Red</li>
        <li>Blue</li>
    </ul>

</body>
</html>
