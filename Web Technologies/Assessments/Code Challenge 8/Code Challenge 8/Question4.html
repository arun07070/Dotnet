<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Hide Odd Rows</title>
    <script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function ()
        {
            $("tr:odd").hide();
        });
    </script>
</head>
<body>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Arun</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Rahul</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Barani</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Athish</td>
        </tr>
    </table>
</body>
</html>
